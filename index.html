<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Venüs Bowling & Cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #080914;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-card {
            background-color: rgba(18, 20, 38, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bg-purple-accent {
            background-color: #7c4dff;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .cat-btn.active {
            background-color: #7c4dff !important;
            color: #ffffff !important;
            border-color: #7c4dff !important;
        }
    </style>
</head>
<body class="pb-24 pt-2">

    <!-- HEADER -->
    <header class="px-5 py-4 flex justify-between items-center max-w-md mx-auto">
        <div>
            <p id="logo-btn" onclick="handleLogoClick()" class="text-[11px] font-extrabold tracking-[0.2em] text-purple-400 uppercase select-none cursor-pointer">VENÜS BOWLING & CAFE</p>
            <h1 class="text-2xl font-bold tracking-tight mt-0.5 text-white">Lezzet & Eğlence</h1>
        </div>
        <div class="w-10 h-10 rounded-full bg-[#15182e] border border-gray-800 flex items-center justify-center text-gray-300">
            <i class="fa-solid fa-utensils text-sm text-amber-400"></i>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-6">

        <!-- HERO BANNER -->
        <div class="relative rounded-[28px] overflow-hidden bg-card p-5 border border-white/10">
            <div class="absolute inset-0 bg-cover bg-center opacity-40" style="background-image: url('https://images.unsplash.com/photo-1538388149542-5e24932d11a8?q=80&w=800');"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#080914] via-[#080914]/60 to-transparent"></div>

            <div class="relative z-10 space-y-3">
                <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[11px] font-medium bg-black/50 backdrop-blur-md text-white border border-white/10">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="hero-badge" class="text-gray-200">Bu akşam için yerini kap</span>
                </span>
                
                <h2 id="hero-title" class="text-2xl font-black leading-tight text-white tracking-wide">Bowling keyfi şimdi başlıyor!</h2>
                <p id="hero-sub" class="text-xs text-gray-300">Bugün 18.00 sonrası pistler hızla doluyor.</p>
                
                <a id="hero-btn-link" href="tel:05000000000" class="bg-purple-accent w-full py-3.5 px-5 rounded-2xl font-bold flex items-center justify-center gap-2 text-white text-sm mt-3 shadow-lg">
                    <span id="hero-btn-text">Pistini Ayırt</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>

        <!-- HIZLI KATEGORİ SEÇİMİ -->
        <div class="grid grid-cols-4 gap-2.5">
            <button onclick="switchTab('menu')" class="bg-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 border border-amber-500/50">
                <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-burger"></i>
                </div>
                <span class="text-xs font-bold text-amber-400">Menü</span>
            </button>
            <button onclick="switchTab('bowling')" class="bg-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 border border-white/5">
                <div class="w-12 h-12 rounded-2xl bg-purple-600/20 text-purple-300 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
                <span class="text-xs font-semibold text-gray-300">Bowling</span>
            </button>
            <button onclick="switchTab('kampanya')" class="bg-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 border border-white/5">
                <div class="w-12 h-12 rounded-2xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-percent"></i>
                </div>
                <span class="text-xs font-semibold text-gray-300">Fırsatlar</span>
            </button>
            <button onclick="switchTab('etkinlik')" class="bg-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 border border-white/5">
                <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl">
                    <i class="fa-regular fa-calendar text-xl"></i>
                </div>
                <span class="text-xs font-semibold text-gray-300">Etkinlik</span>
            </button>
        </div>

        <!-- BUGÜNÜN KAMPANYALARI (KARTLAR) -->
        <div id="section-kampanyalar" class="space-y-3">
            <div class="flex justify-between items-end px-1">
                <div>
                    <h3 class="font-bold text-xl text-white">Özel Kampanyalar</h3>
                    <p class="text-xs text-gray-400">Oyun + Menü avantaj paketleri</p>
                </div>
            </div>

            <div id="campaigns-container" class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                <!-- JS ile yüklenecek -->
            </div>
        </div>

        <!-- DİNAMİK İÇERİK & GÖRSEL MENÜ ALANI -->
        <div id="dynamic-content-area" class="space-y-4">
            
            <!-- MENÜ KATEGORİ SEKMELERİ -->
            <div id="menu-categories" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterCategory('Tümü', this)" class="cat-btn active px-4 py-2.5 rounded-2xl text-xs font-bold bg-card border border-white/10 text-gray-300 whitespace-nowrap">🔥 Tümü</button>
                <button onclick="filterCategory('Burger & Fast Food', this)" class="cat-btn px-4 py-2.5 rounded-2xl text-xs font-bold bg-card border border-white/10 text-gray-300 whitespace-nowrap">🍔 Burger & Pizza</button>
                <button onclick="filterCategory('Atıştırmalık', this)" class="cat-btn px-4 py-2.5 rounded-2xl text-xs font-bold bg-card border border-white/10 text-gray-300 whitespace-nowrap">🍟 Atıştırmalıklar</button>
                <button onclick="filterCategory('Soğuk İçecekler', this)" class="cat-btn px-4 py-2.5 rounded-2xl text-xs font-bold bg-card border border-white/10 text-gray-300 whitespace-nowrap">🥤 Soğuk İçecekler</button>
                <button onclick="filterCategory('Sıcak İçecekler', this)" class="cat-btn px-4 py-2.5 rounded-2xl text-xs font-bold bg-card border border-white/10 text-gray-300 whitespace-nowrap">☕ Kahve & Çay</button>
                <button onclick="filterCategory('Tatlılar', this)" class="cat-btn px-4 py-2.5 rounded-2xl text-xs font-bold bg-card border border-white/10 text-gray-300 whitespace-nowrap">🍰 Tatlılar</button>
            </div>

            <!-- ÜRÜN KARTLARI LİSTESİ -->
            <div id="menu-items-list" class="space-y-3">
                <!-- JS ile İştah Açıcı Görselli Ürün Kartları Basılacak -->
            </div>
        </div>

    </main>

    <!-- ALT NAVİGASYON (BOTTOM BAR) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#080914]/95 backdrop-blur-xl border-t border-white/5 px-8 py-3 max-w-md mx-auto z-40">
        <div class="flex justify-between items-center">
            <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">Ana Sayfa</span>
            </button>
            <button onclick="switchTab('menu')" class="flex flex-col items-center gap-1 text-purple-400">
                <i class="fa-solid fa-utensils text-lg"></i>
                <span class="text-[10px] font-bold">Leziz Menü</span>
            </button>
            <button onclick="switchTab('bowling')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-400">
                <i class="fa-solid fa-bullseye text-lg"></i>
                <span class="text-[10px] font-medium">Bowling</span>
            </button>
        </div>
    </nav>

    <!-- YÖNETİCİ PANELİ MODALI -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#121426] border border-purple-500/30 w-full max-w-sm rounded-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="font-bold text-purple-400 flex items-center gap-2">
                    <i class="fa-solid fa-gear"></i> Yönetici Paneli
                </h3>
                <button onclick="closeAdmin()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-2 text-xs">
                <p class="font-bold text-gray-300">Menüye Görselli Ürün Ekle</p>
                <select id="input-menu-cat" class="w-full bg-gray-900 border border-gray-800 p-3 rounded-xl text-white">
                    <option value="Burger & Fast Food">Burger & Pizza</option>
                    <option value="Atıştırmalık">Atıştırmalık</option>
                    <option value="Soğuk İçecekler">Soğuk İçecekler</option>
                    <option value="Sıcak İçecekler">Kahve & Çay</option>
                    <option value="Tatlılar">Tatlılar</option>
                </select>
                <input id="input-menu-name" type="text" placeholder="Ürün Adı" class="w-full bg-gray-900 border border-gray-800 p-3 rounded-xl text-white">
                <input id="input-menu-desc" type="text" placeholder="Açıklama / İçerik" class="w-full bg-gray-900 border border-gray-800 p-3 rounded-xl text-white">
                <input id="input-menu-price" type="text" placeholder="Fiyat (Örn: 240 ₺)" class="w-full bg-gray-900 border border-gray-800 p-3 rounded-xl text-white">
                <input id="input-menu-img" type="text" placeholder="Görsel URL (Unsplash vb.)" class="w-full bg-gray-900 border border-gray-800 p-3 rounded-xl text-white">
                <button onclick="addMenuItem()" class="w-full bg-amber-600 hover:bg-amber-700 p-3 rounded-xl font-bold text-white">Ürün Ekle</button>
            </div>

            <button onclick="saveAdminData()" class="w-full bg-purple-accent p-3.5 rounded-xl font-bold text-sm text-white mt-4">Kaydet & Kapat</button>
        </div>
    </div>

    <!-- JAVASCRIPT KODLARI -->
    <script>
        const initialData = {
            hero: {
                badge: "Bu akşam için yerini kap",
                title: "Bowling keyfi şimdi başlıyor!",
                sub: "Bugün 18.00 sonrası pistler hızla doluyor.",
                btnText: "Pistini Ayırt",
                btnLink: "tel:05000000000"
            },
            campaigns: [
                { id: 1, tag: "ÇOK SATAN", title: "2 Oyun + Burger Menü", desc: "150gr Burger + Patates + 330ml İçecek", price: "480 ₺" },
                { id: 2, tag: "AİLE PAKETİ", title: "Bowling & Snack Combo", desc: "4 Kişi 1 Oyun + Mega Patates Sepeti", price: "990 ₺" }
            ],
            menuItems: [
                // Burger & Pizza
                { 
                    category: "Burger & Fast Food", 
                    name: "Venüs Special Burger", 
                    desc: "150gr %100 Dana köfte, karamelize soğan, cheddar, özel sos & baharatlı patates ile", 
                    price: "240 ₺",
                    badge: "Şefin Tavsiyesi",
                    img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=400"
                },
                { 
                    category: "Burger & Fast Food", 
                    name: "Karışık Nefis Pizza", 
                    desc: "Özel pizza sosu, mozzaella, sucuk, sosis, mantar, mısır ve zeytin", 
                    price: "250 ₺",
                    badge: "Popüler",
                    img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=400"
                },
                { 
                    category: "Burger & Fast Food", 
                    name: "Çıtır Chicken Burger", 
                    desc: "Pane kaplı çıtır tavuk fileto, marul, turşu, mayonez & patates kızartması", 
                    price: "210 ₺",
                    badge: "",
                    img: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?q=80&w=400"
                },

                // Atıştırmalıklar
                { 
                    category: "Atıştırmalık", 
                    name: "Mega Combo Sepet", 
                    desc: "Çıtır tavuklar, sosis dilimleri, soğan halkası, mozzarella çubukları & baharatlı patates", 
                    price: "280 ₺",
                    badge: "Paylaşımlık",
                    img: "https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?q=80&w=400"
                },
                { 
                    category: "Atıştırmalık", 
                    name: "Baharatlı Çıtır Patates", 
                    desc: "Özel Venüs çeşnili taze kızartılmış elma dilim / parmak patates", 
                    price: "130 ₺",
                    badge: "",
                    img: "https://images.unsplash.com/photo-1576107232684-1279f390859f?q=80&w=400"
                },

                // Soğuk İçecekler
                { 
                    category: "Soğuk İçecekler", 
                    name: "Buz Gibi Coca-Cola", 
                    desc: "330ml Soğuk Kutu Şişe", 
                    price: "60 ₺",
                    badge: "",
                    img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?q=80&w=400"
                },
                { 
                    category: "Soğuk İçecekler", 
                    name: "Iced Caramel Latte", 
                    desc: "Espresso, soğuk süt, karamel aroması ve bol buz", 
                    price: "115 ₺",
                    badge: "Ferahlatıcı",
                    img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80&w=400"
                },

                // Sıcak İçecekler
                { 
                    category: "Sıcak İçecekler", 
                    name: "Geleneksel Türk Kahvesi", 
                    desc: "Çikolata ve su ikramı ile birlikte", 
                    price: "65 ₺",
                    badge: "",
                    img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=400"
                },
                { 
                    category: "Sıcak İçecekler", 
                    name: "Caffe Latte", 
                    desc: "Taze çekilmiş espresso ve kadifemsi süt köpüğü", 
                    price: "95 ₺",
                    badge: "",
                    img: "https://images.unsplash.com/photo-1534778101976-62847782c213?q=80&w=400"
                },

                // Tatlılar
                { 
                    category: "Tatlılar", 
                    name: "Sıcak Çikolatalı Sufle", 
                    desc: "İçi akışkan Belçika çikolatası & vanilyalı dondurma topu ile", 
                    price: "160 ₺",
                    badge: "Favori",
                    img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?q=80&w=400"
                },
                { 
                    category: "Tatlılar", 
                    name: "Belçika Çikolatalı Waffle", 
                    desc: "Çilek, muz, fındık parçaları ve bol çikolata sosu", 
                    price: "190 ₺",
                    badge: "",
                    img: "https://images.unsplash.com/photo-1562376552-0d160a2f238d?q=80&w=400"
                }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('venus_app_data_v4')) || initialData;

        function renderApp() {
            document.getElementById('hero-badge').innerText = appData.hero.badge;
            document.getElementById('hero-title').innerText = appData.hero.title;
            document.getElementById('hero-sub').innerText = appData.hero.sub;
            document.getElementById('hero-btn-text').innerText = appData.hero.btnText;
            document.getElementById('hero-btn-link').href = appData.hero.btnLink;

            const campContainer = document.getElementById('campaigns-container');
            campContainer.innerHTML = '';
            appData.campaigns.forEach((c) => {
                campContainer.innerHTML += `
                    <div class="min-w-[270px] bg-card p-4 rounded-[22px] flex flex-col justify-between border border-amber-500/30 relative">
                        <div>
                            <span class="text-[10px] font-extrabold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-md uppercase tracking-wider">${c.tag}</span>
                            <h4 class="font-bold text-base mt-2 text-white leading-snug">${c.title}</h4>
                            <p class="text-[11px] text-gray-400 mt-1">${c.desc}</p>
                        </div>
                        <div class="flex justify-between items-end mt-4">
                            <span class="text-lg font-black text-amber-400">${c.price}</span>
                            <a href="${appData.hero.btnLink}" class="px-3 py-1.5 rounded-xl bg-purple-accent text-white font-bold text-xs flex items-center gap-1">
                                Sipariş Et <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            });

            renderMenuItems(appData.menuItems);
        }

        function renderMenuItems(items) {
            const list = document.getElementById('menu-items-list');
            list.innerHTML = '';

            items.forEach(item => {
                const badgeHtml = item.badge 
                    ? `<span class="absolute top-2 left-2 bg-purple-600/90 backdrop-blur-md text-white text-[9px] font-extrabold px-2 py-0.5 rounded-md">${item.badge}</span>` 
                    : '';

                list.innerHTML += `
                    <div class="bg-card rounded-2xl p-3 flex gap-3 border border-white/5 items-center relative overflow-hidden">
                        <div class="relative w-24 h-24 rounded-xl overflow-hidden flex-shrink-0 bg-gray-900">
                            <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover">
                            ${badgeHtml}
                        </div>
                        <div class="flex-1 flex flex-col justify-between h-24 py-0.5">
                            <div>
                                <h4 class="font-bold text-sm text-white leading-snug">${item.name}</h4>
                                <p class="text-[11px] text-gray-400 line-clamp-2 mt-1 leading-tight">${item.desc}</p>
                            </div>
                            <div class="flex justify-between items-center mt-1">
                                <span class="text-base font-black text-amber-400">${item.price}</span>
                                <a href="${appData.hero.btnLink}" class="w-8 h-8 rounded-xl bg-purple-500/20 text-purple-300 hover:bg-purple-accent hover:text-white flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            if (cat === 'Tümü') {
                renderMenuItems(appData.menuItems);
            } else {
                const filtered = appData.menuItems.filter(i => i.category === cat);
                renderMenuItems(filtered);
            }
        }

        function switchTab(tab) {
            if (tab === 'bowling') {
                alert("Bowling Fiyatları:\nHafta İçi: 180 ₺\nHafta Sonu: 220 ₺\nÖğrenci: 150 ₺");
            } else if (tab === 'home' || tab === 'menu') {
                filterCategory('Tümü', document.querySelector('.cat-btn'));
            }
        }

        // 5 TIK YÖNETİCİ PANELİ
        let clickCount = 0;
        let clickTimer;
        function handleLogoClick() {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);

            if (clickCount >= 5) {
                clickCount = 0;
                document.getElementById('admin-modal').classList.remove('hidden');
            }
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function addMenuItem() {
            const category = document.getElementById('input-menu-cat').value;
            const name = document.getElementById('input-menu-name').value;
            const desc = document.getElementById('input-menu-desc').value;
            const price = document.getElementById('input-menu-price').value;
            const img = document.getElementById('input-menu-img').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=400';

            if (name && price) {
                appData.menuItems.unshift({ category, name, desc, price, img, badge: 'Yeni' });
                alert("Ürün menüye eklendi!");
                document.getElementById('input-menu-name').value = '';
                document.getElementById('input-menu-price').value = '';
            }
        }

        function saveAdminData() {
            localStorage.setItem('venus_app_data_v4', JSON.stringify(appData));
            renderApp();
            closeAdmin();
        }

        renderApp();
    </script>
</body>
</html>
