<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venüs Bowling & Cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0d17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .purple-gradient-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        }
        .purple-gradient-btn:active {
            transform: scale(0.98);
        }
        .glass-card {
            background: rgba(22, 27, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER / ÜST KISIM -->
    <header class="p-5 flex justify-between items-center max-w-md mx-auto">
        <div>
            <p id="logo-btn" onclick="handleLogoClick()" class="text-xs font-bold tracking-widest text-purple-400 uppercase select-none cursor-pointer">VENÜS BOWLING</p>
            <h1 class="text-2xl font-black tracking-tight mt-0.5">Merhaba, Hoş Geldiniz!</h1>
        </div>
        <div class="w-10 h-10 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-gray-300">
            <i class="fa-solid fa-user"></i>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-6">

        <!-- HERO BANNER (PİST REZERVASYON) -->
        <div class="relative rounded-3xl overflow-hidden glass-card p-5 border border-purple-900/40">
            <div class="absolute inset-0 bg-cover bg-center opacity-30" style="background-image: url('https://images.unsplash.com/photo-1538388149542-5e24932d11a8?q=80&w=800');"></div>
            <div class="relative z-10 space-y-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-black/60 backdrop-blur-md text-emerald-400 border border-emerald-500/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="hero-badge">Bu akşam için yerini kap</span>
                </span>
                
                <h2 id="hero-title" class="text-2xl font-black leading-tight">Bowling keyfi şimdi başlıyor!</h2>
                <p id="hero-sub" class="text-xs text-gray-300">Bugün 18.00 sonrası pistler hızla doluyor.</p>
                
                <a id="hero-btn-link" href="tel:05000000000" class="purple-gradient-btn w-full py-3.5 px-5 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-purple-900/40 text-sm mt-2 transition-all">
                    <span id="hero-btn-text">Pistini Ayırt</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>

        <!-- HIZLI ERİŞİM KATEGORİLERİ -->
        <div class="grid grid-cols-4 gap-2.5">
            <button onclick="switchTab('bowling')" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-purple-500/50 transition-all">
                <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-bowling-ball"></i>
                </div>
                <span class="text-xs font-semibold text-gray-200">Bowling</span>
            </button>
            <button onclick="switchTab('menu')" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-purple-500/50 transition-all">
                <div class="w-10 h-10 rounded-xl bg-amber-600/20 text-amber-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <span class="text-xs font-semibold text-gray-200">Cafe & Menü</span>
            </button>
            <button onclick="switchTab('kampanya')" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-purple-500/50 transition-all">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-percent"></i>
                </div>
                <span class="text-xs font-semibold text-gray-200">Kampanyalar</span>
            </button>
            <button onclick="switchTab('etkinlik')" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-purple-500/50 transition-all">
                <div class="w-10 h-10 rounded-xl bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <span class="text-xs font-semibold text-gray-200">Etkinlikler</span>
            </button>
        </div>

        <!-- BUGÜNÜN KAMPANYALARI -->
        <div id="section-kampanyalar" class="space-y-3">
            <div class="flex justify-between items-end">
                <div>
                    <h3 class="font-bold text-lg">Bugünün Kampanyaları</h3>
                    <p class="text-xs text-gray-400">Geceye özel fırsatlar</p>
                </div>
            </div>

            <!-- Yatay Kaydırılabilir Kartlar -->
            <div id="campaigns-container" class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                <!-- JS ile dinamik dolacak -->
            </div>
        </div>

        <!-- MENÜ / DİĞER İÇERİK ALANI -->
        <div id="dynamic-content-area" class="hidden glass-card p-4 rounded-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 id="tab-title" class="font-bold text-lg text-purple-400">Detaylar</h3>
                <button onclick="switchTab('home')" class="text-xs text-gray-400"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="tab-content-body" class="space-y-3">
                <!-- Dinamik içerik buraya yüklenecek -->
            </div>
        </div>

    </main>

    <!-- ALT SABİT NAVİGASYON (BOTTOM BAR) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0b0d17]/90 backdrop-blur-lg border-t border-gray-800/80 px-6 py-3 max-w-md mx-auto z-40">
        <div class="flex justify-around items-center">
            <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 text-purple-500">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">Ana Sayfa</span>
            </button>
            <button onclick="switchTab('bowling')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-400">
                <i class="fa-solid fa-bowling-ball text-lg"></i>
                <span class="text-[10px] font-medium">Bowling</span>
            </button>
            <button onclick="switchTab('menu')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-400">
                <i class="fa-solid fa-utensils text-lg"></i>
                <span class="text-[10px] font-medium">Menü</span>
            </button>
        </div>
    </nav>

    <!-- YÖNETİCİ PANELİ MODALI -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#161b2e] border border-purple-500/30 w-full max-w-sm rounded-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="font-bold text-purple-400 flex items-center gap-2">
                    <i class="fa-solid fa-gear"></i> Yönetici Paneli
                </h3>
                <button onclick="closeAdmin()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- BANNER DÜZENLEME -->
            <div class="space-y-2 text-xs">
                <p class="font-bold text-gray-300">Manşet (Hero) Ayarları</p>
                <input id="input-badge" type="text" placeholder="Rozet Metni" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <input id="input-title" type="text" placeholder="Manşet Başlığı" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <input id="input-sub" type="text" placeholder="Alt Metin" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <input id="input-btn-text" type="text" placeholder="Buton Metni" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <input id="input-btn-link" type="text" placeholder="Buton Linki (Tel/WhatsApp)" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
            </div>

            <hr class="border-gray-800">

            <!-- YENİ KAMPANYA EKLEME -->
            <div class="space-y-2 text-xs">
                <p class="font-bold text-gray-300">Yeni Kampanya Ekle</p>
                <input id="input-camp-tag" type="text" placeholder="Etiket (Örn: HAFTA İÇİ)" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <input id="input-camp-title" type="text" placeholder="Paket Adı (Örn: 2 Oyun + 1 İçecek)" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <input id="input-camp-desc" type="text" placeholder="Detay (Örn: Pazartesi - Perşembe)" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <input id="input-camp-price" type="text" placeholder="Fiyat (Örn: 349 ₺)" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-xl text-white">
                <button onclick="addCampaign()" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded-xl font-bold text-white">Kampanya Ekle</button>
            </div>

            <button onclick="saveAdminData()" class="w-full purple-gradient-btn py-3 rounded-xl font-bold text-sm shadow-lg text-white">Tüm Değişiklikleri Kaydet</button>
        </div>
    </div>

    <!-- JAVASCRIPT KODLARI -->
    <script>
        // Varsayılan Veriler
        let defaultData = {
            hero: {
                badge: "Bu akşam için yerini kap",
                title: "Bowling keyfi şimdi başlıyor!",
                sub: "Bugün 18.00 sonrası pistler hızla doluyor.",
                btnText: "Pistini Ayırt",
                btnLink: "tel:05000000000"
            },
            campaigns: [
                { id: 1, tag: "HAFTA İÇİ", title: "2 Oyun + 1 İçecek", desc: "Pazartesi — Perşembe", price: "349 ₺" },
                { id: 2, tag: "AİLE PAKETİ", title: "Aile Saati (4 Kişi)", desc: "4 kişi + patates & içecek", price: "1.190 ₺" }
            ],
            menuItems: [
                { category: "Sıcak İçecekler", name: "Türk Kahvesi", price: "60 ₺" },
                { category: "Atıştırmalıklar", name: "Patates Tabağı", price: "120 ₺" },
                { category: "Soğuk İçecekler", name: "Soft İçecekler", price: "50 ₺" }
            ]
        };

        // Veriyi Yükle
        let appData = JSON.parse(localStorage.getItem('venus_app_data')) || defaultData;

        function renderApp() {
            // Hero Güncelleme
            document.getElementById('hero-badge').innerText = appData.hero.badge;
            document.getElementById('hero-title').innerText = appData.hero.title;
            document.getElementById('hero-sub').innerText = appData.hero.sub;
            document.getElementById('hero-btn-text').innerText = appData.hero.btnText;
            document.getElementById('hero-btn-link').href = appData.hero.btnLink;

            // Kampanyaları Güncelleme
            const campContainer = document.getElementById('campaigns-container');
            campContainer.innerHTML = '';
            appData.campaigns.forEach(c => {
                campContainer.innerHTML += `
                    <div class="min-w-[240px] glass-card p-4 rounded-2xl flex flex-col justify-between relative border border-purple-900/30">
                        <div>
                            <span class="text-[10px] font-bold text-purple-400 tracking-wider uppercase">${c.tag}</span>
                            <h4 class="font-bold text-base mt-1 text-white">${c.title}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">${c.desc}</p>
                        </div>
                        <div class="flex justify-between items-end mt-4">
                            <div>
                                <span class="text-[10px] text-gray-400 block">Paket fiyatı</span>
                                <span class="text-lg font-black text-white">${c.price}</span>
                            </div>
                            <a href="${appData.hero.btnLink}" class="w-8 h-8 rounded-xl bg-purple-600/30 text-purple-300 flex items-center justify-center text-xs">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // TAB GEÇİŞLERİ
        function switchTab(tab) {
            const contentArea = document.getElementById('dynamic-content-area');
            const tabTitle = document.getElementById('tab-title');
            const tabBody = document.getElementById('tab-content-body');

            if (tab === 'home') {
                contentArea.classList.add('hidden');
                return;
            }

            contentArea.classList.remove('hidden');
            tabBody.innerHTML = '';

            if (tab === 'bowling') {
                tabTitle.innerText = "Bowling Fiyat Listesi";
                tabBody.innerHTML = `
                    <div class="flex justify-between p-3 bg-gray-900/50 rounded-xl text-sm"><span>1 Oyun (Kişi Başı)</span><span class="font-bold text-purple-400">180 ₺</span></div>
                    <div class="flex justify-between p-3 bg-gray-900/50 rounded-xl text-sm"><span>Student / Öğrenci</span><span class="font-bold text-purple-400">150 ₺</span></div>
                `;
            } else if (tab === 'menu') {
                tabTitle.innerText = "Cafe & Menü";
                appData.menuItems.forEach(m => {
                    tabBody.innerHTML += `
                        <div class="flex justify-between p-3 bg-gray-900/50 rounded-xl text-sm">
                            <span>${m.name}</span>
                            <span class="font-bold text-amber-400">${m.price}</span>
                        </div>
                    `;
                });
            } else if (tab === 'kampanya') {
                tabTitle.innerText = "Tüm Kampanyalar";
                tabBody.innerHTML = "<p class='text-xs text-gray-400'>Yukarıdaki kaydırılabilir kartlardan detayları inceleyebilirsiniz.</p>";
            } else if (tab === 'etkinlik') {
                tabTitle.innerText = "Etkinlikler & Turnuvalar";
                tabBody.innerHTML = "<p class='text-xs text-gray-400'>Yakında düzenlenecek bowling turnuvaları burada duyurulacaktır.</p>";
            }
        }

        // YÖNETİCİ PANELİ MANTIĞI (5 TIKLAMA)
        let clickCount = 0;
        let clickTimer;
        function handleLogoClick() {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);

            if (clickCount >= 5) {
                clickCount = 0;
                openAdmin();
            }
        }

        function openAdmin() {
            document.getElementById('input-badge').value = appData.hero.badge;
            document.getElementById('input-title').value = appData.hero.title;
            document.getElementById('input-sub').value = appData.hero.sub;
            document.getElementById('input-btn-text').value = appData.hero.btnText;
            document.getElementById('input-btn-link').value = appData.hero.btnLink;
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function addCampaign() {
            const tag = document.getElementById('input-camp-tag').value;
            const title = document.getElementById('input-camp-title').value;
            const desc = document.getElementById('input-camp-desc').value;
            const price = document.getElementById('input-camp-price').value;

            if (title && price) {
                appData.campaigns.push({ id: Date.now(), tag: tag || "FIRSAT", title, desc, price });
                alert("Kampanya eklendi!");
                document.getElementById('input-camp-title').value = '';
                document.getElementById('input-camp-price').value = '';
            }
        }

        function saveAdminData() {
            appData.hero.badge = document.getElementById('input-badge').value;
            appData.hero.title = document.getElementById('input-title').value;
            appData.hero.sub = document.getElementById('input-sub').value;
            appData.hero.btnText = document.getElementById('input-btn-text').value;
            appData.hero.btnLink = document.getElementById('input-btn-link').value;

            localStorage.setItem('venus_app_data', JSON.stringify(appData));
            renderApp();
            closeAdmin();
            alert("Tüm değişiklikler kaydedildi!");
        }

        // İlk Çalıştırma
        renderApp();
    </script>
</body>
</html>
